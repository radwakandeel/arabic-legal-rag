[project]
name = "arabic-legal-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Radwa Kandeel", email = "radwa8671@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "fastapi>=0.143.0",
    "mlflow>=3.17.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.0",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
arabic-legal-rag = "arabic_legal_rag:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langchain-community==0.4.1",
    "pytest>=9.1.1",
    "ragas>=0.4.3",
    "ruff>=0.17.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# These three files are dependencies of dvc.yaml, so editing them would make DVC
# mark the pipeline stale and ask for a ~20 minute index rebuild. Their findings
# are style-only and are ignored here instead of fixed.
[tool.ruff.lint.per-file-ignores]
"src/arabic_legal_rag/chunk.py" = ["FURB167"]
"src/arabic_legal_rag/extract.py" = ["FURB167", "UP031"]
"src/arabic_legal_rag/index.py" = ["S110", "BLE001"]
